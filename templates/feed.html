<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лента оборудования</title>
    <link rel="stylesheet" href="/static/styles/main.css">
</head>
<body>
    <div class="mobile-screen">
        <div class="feed-container">
            <video class="feed-video" autoplay muted loop playsinline src="{{ .Device.VideoURL }}"></video>

            <div class="feed-overlay-info">
                <h2 style="font-size: 18px;">{{ .Device.DeviceName }}</h2>
                <p style="font-size: 12px; margin: 4px 0;">{{ .Device.DeviceDescription }}</p>
                <div style="font-weight: bold; font-size: 13px; margin-top: 6px;">
                    ⚡ {{ .Device.ActivePowerWatts }} Вт &nbsp;|&nbsp; cos φ {{ .Device.PowerFactor }}
                </div>
            </div>

            <div class="feed-overlay-actions">
                <div class="action-btn">
                    ♥ <span>{{ .Device.LikesCount }}</span>
                </div>
                <a href="/office-devices/feed?device_id={{ .Device.ID }}&next=true" class="action-btn" title="Следующий">
                    ➔
                </a>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="/office-devices/feed" class="active">Лента</a>
            <a href="/office-devices/draft">Добавление</a>
            <a href="/office-devices/grid">Плитка</a>
        </div>
    </div>
</body>
</html>
