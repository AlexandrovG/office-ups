<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление оборудования</title>
    <link rel="stylesheet" href="/static/styles/main.css">
</head>
<body>
    <div class="mobile-screen">
        <div class="draft-container">
            <h3 style="margin-bottom: 4px; font-size: 18px;">Добавление оборудования</h3>
            <span class="badge-draft">ЧЕРНОВИК</span>

            <div class="draft-media">
                <label style="font-size: 12px; color: #6B7280;">Изображение (MinIO):</label>
                <img src="{{ .Device.ImageURL }}" alt="Превью">
                <label style="font-size: 12px; color: #6B7280;">Видеодемонстрация (MinIO):</label>
                <video src="{{ .Device.VideoURL }}" controls></video>
            </div>

            <div class="form-group">
                <label>Наименование оборудования</label>
                <input type="text" value="{{ .Device.DeviceName }}">
            </div>
            <div class="form-group">
                <label>Описание характера нагрузок</label>
                <textarea rows="2">{{ .Device.DeviceDescription }}</textarea>
            </div>
            <div class="form-group">
                <label>Активная мощность (Вт)</label>
                <input type="number" value="{{ .Device.ActivePowerWatts }}">
            </div>
            <div class="form-group">
                <label>Коэффициент мощности (cos φ)</label>
                <input type="text" value="{{ .Device.PowerFactor }}">
            </div>
        </div>

        <div class="bottom-nav">
            <a href="/office-devices/feed">Лента</a>
            <a href="/office-devices/draft" class="active">Добавление</a>
            <a href="/office-devices/grid">Плитка</a>
        </div>
    </div>
</body>
</html>
