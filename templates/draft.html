<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление оборудования</title>
    <link rel="stylesheet" href="/static/styles/main.css">
</head>
<body>
    <div class="mobile-screen">
        <div class="draft-container">
            <h3 style="margin-bottom: 4px; font-size: 18px;">Добавление оборудования</h3>
            <span class="badge-draft">ЧЕРНОВИК</span>

            {{ if not .HasDraft }}
            <form action="/office-devices/draft/create" method="POST" style="margin-top: 16px;">
                <div class="form-group">
                    <label>Наименование оборудования</label>
                    <input type="text" name="device_name" placeholder="Введите название..." required>
                </div>
                <p style="font-size: 12px; color: #6B7280; margin-bottom: 12px;">Медиафайлы будут заданы по умолчанию.</p>
                <button type="submit" style="width: 100%; padding: 10px; background: #1F2429; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Далее</button>
            </form>
            {{ else }}
            <div class="draft-media">
                <label style="font-size: 12px; color: #6B7280;">Изображение:</label>
                <img src="{{ .Device.ImageURL }}" alt="Превью">
                <label style="font-size: 12px; color: #6B7280;">Видеодемонстрация:</label>
                <video src="{{ .Device.VideoURL }}" controls></video>
            </div>

            <form action="/office-devices/draft/publish" method="POST">
                <div class="form-group">
                    <label>Наименование оборудования</label>
                    <input type="text" value="{{ .Device.DeviceName }}" disabled>
                </div>
                <div class="form-group">
                    <label>Описание характера нагрузок</label>
                    <textarea name="device_description" rows="2" required>{{ .Device.DeviceDescription }}</textarea>
                </div>
                <div class="form-group">
                    <label>Активная мощность (Вт)</label>
                    <input type="number" name="active_power_watts" value="{{ .Device.ActivePowerWatts }}" required>
                </div>
                <div class="form-group">
                    <label>Коэффициент мощности (cos φ)</label>
                    <input type="text" name="power_factor" value="{{ .Device.PowerFactor }}" required>
                </div>
                <button type="submit" style="width: 100%; padding: 10px; background: #1F2429; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Опубликовать</button>
            </form>
            {{ end }}
        </div>

        <div class="bottom-nav">
            <a href="/office-devices/feed">Лента</a>
            <a href="/office-devices/draft" class="active">Добавление</a>
            <a href="/office-devices/grid">Плитка</a>
        </div>
    </div>
</body>
</html>
